; PlatformIO config สำหรับ gateway CB302 (ESP32-S3)
;
;   pio run -c pio-gateway.ini              # คอมไพล์
;   pio run -c pio-gateway.ini -t upload    # อัปโหลด (ต้องมี secrets.h ก่อน)
;   pio device monitor -c pio-gateway.ini
;
; ใช้กล้อง OV7670 ผ่านไลบรารี espressif/esp32-camera (ติดตั้งจาก GitHub)
; ปิดกล้องได้ด้วย WEARWISE_CAMERA 0 ใน gateway/config.h

[platformio]
src_dir = gateway

[env:gateway]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    madhephaestus/ESP32Servo@^3.0.6
    https://github.com/espressif/esp32-camera.git
