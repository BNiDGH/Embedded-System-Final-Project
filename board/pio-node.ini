; PlatformIO config สำหรับ sensor node NA709 (ESP32)
;
;   pio run -c pio-node.ini              # คอมไพล์
;   pio run -c pio-node.ini -t upload    # อัปโหลด
;   pio device monitor -c pio-node.ini   # ดู Serial 115200
;
; หมายเหตุ: PlatformIO ตั้ง src_dir ได้ระดับโปรเจกต์เท่านั้น จึงแยกไฟล์ ini
; ต่อบอร์ด (อีกไฟล์คือ pio-gateway.ini) เฟิร์มแวร์ชุดเดียวกับ Arduino IDE

[platformio]
src_dir = sensor_node

[env:node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0
